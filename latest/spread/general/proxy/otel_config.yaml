receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "node_exporter"
          scrape_interval: 5s
          static_configs:
            - targets: ["localhost:9100"]

exporters:
  prometheusremotewrite:
    endpoint: "http://HOST:9090/api/v1/write"

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
